[package]
name = "vtt-map-creator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
